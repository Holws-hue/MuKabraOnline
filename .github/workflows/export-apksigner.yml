name: KABRA - herramientas oficiales para verificar APK
on:
  push:
    paths:
      - '.github/workflows/export-apksigner.yml'
  workflow_dispatch:
jobs:
  sdk-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar Android Build Tools 36
        shell: bash
        run: sdkmanager "build-tools;36.0.0"
      - name: Preparar apksigner
        shell: bash
        run: |
          mkdir -p signer
          find "$ANDROID_HOME/build-tools/36.0.0/" -name 'apksigner.jar' -print
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signer/apksigner.jar
          sha256sum signer/apksigner.jar
          java -cp signer/apksigner.jar com.android.apksigner.ApkSignerTool --help >/dev/null
      - name: Publicar utilitario para verificacion local
        uses: actions/upload-artifact@v4
        with:
          name: KABRA-Android-ApkSigner-Toolkit
          path: signer/apksigner.jar
          if-no-files-found: error
