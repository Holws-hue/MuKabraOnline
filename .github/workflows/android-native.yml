name: KABRA Android - compilacion de prueba
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-native.yml'
      - 'scripts/configure-kabra.ps1'
      - 'scripts/branding-kabra.ps1'
      - 'branding/logo_kabra_64.png.base64'
      - 'scripts/login-louis31-es.ps1'
      - 'scripts/fix-android-startup-es.ps1'
      - 'patches/KabraLouis31Pipe.cs'
      - 'tests/Louis31Transport/**'
jobs:
  android-preview:
    name: Cliente MonoGame Android ARM64
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      NUGET_XMLDOC_MODE: skip
      MSBUILDDISABLENODEREUSE: 1
      KABRA_CONNECT_HOST: 523.ddns.net
      KABRA_CONNECT_PORT: '44405'
      KABRA_CLIENT_VERSION: '1.04.05'
      KABRA_CLIENT_SERIAL: ${{ secrets.KABRA_CLIENT_SERIAL }}
    steps:
      - name: Descargar configuracion KABRA
        uses: actions/checkout@v4
      - name: Descargar motor MonoGame sin Babylon
        uses: actions/checkout@v4
        with:
          repository: xulek/muonline
          ref: f3365cb1f5231d26979f16813204ab55ced699b7
          path: upstream
          submodules: recursive
      - name: Aplicar configuracion de laboratorio KABRA
        shell: pwsh
        run: ./scripts/configure-kabra.ps1
      - name: Generar arte del menu e iconos de MU KABRA
        shell: pwsh
        run: ./scripts/branding-kabra.ps1
      - name: Corregir login Louis31 y traducir al espanol
        shell: pwsh
        run: ./scripts/login-louis31-es.ps1
      - name: Quitar dialogo IP/Port y traducir pantalla inicial
        shell: pwsh
        run: ./scripts/fix-android-startup-es.ps1
      - name: Comprobar que Android no solicite IP ni puerto
        shell: pwsh
        run: |
          $load = Get-Content upstream/Client.Main/Scenes/LoadScene.cs -Raw
          if ($load.Contains('nextSceneType = typeof(ServerConfigScene);')) { throw 'La APK todavia entra al editor IP/Port' }
          if (!$load.Contains('nextSceneType = typeof(LoginScene);')) { throw 'No se encontró el acceso directo a LoginScene' }
          $config = Get-Content upstream/MuAndroid/MuAndroid.csproj -Raw
          if (!$config.Contains('com.kabraonline.inicio12')) { throw 'Version 0.6 sin ID de Android independiente' }
          $view = Get-Content upstream/Client.Main/Controls/UI/Loading/LoadingScreenView.cs -Raw
          if (!$view.Contains('"CONSEJO"')) { throw 'El texto TIP sigue en ingles' }
          $login = Get-Content upstream/Client.Main/Scenes/LoginScene.cs -Raw
          if ($login.Contains('Controls.Add(_eventGroup);')) { throw 'EVENTS sigue visible en Android' }
          if (!$login.Contains('server.ServerId == 9')) { throw 'KABRA PVP no esta filtrado' }
          $packet = Get-Content upstream/Client.Main/Networking/PacketHandling/PacketBuilder.cs -Raw
          if (!$packet.Contains('var packet = new LoginLongPassword(memory);')) { throw 'Login Louis S6 de 60 bytes no aplicado' }
          if (!$packet.Contains('int length = LoginLongPassword.Length;')) { throw 'Longitud de paquete Louis S6 incorrecta' }
          if ($packet.Contains('var packet = new LoginShortPassword(memory);')) { throw 'El login corto no es compatible con los offsets de esta version' }
          if (!$packet.Contains('memory.Span.Clear();')) { throw 'Login sin limpieza del paquete' }
          if (!$packet.Contains('userSpan.Clear();') -or !$packet.Contains('passSpan.Clear();')) { throw 'Login con buffers no inicializados' }
          if (!$packet.Contains('BuildKabraInitialPingPacket')) { throw 'Ping S6 ausente' }
          $loadView = Get-Content upstream/Client.Main/Controls/UI/Loading/LoadingScreenView.cs -Raw
          if ($loadView.Contains('DrawTitle(sb, barY, ui);') -or $loadView.Contains('DrawBar(sb, screen, barY, ui);')) { throw 'Quedaron barras o titulo amarillo' }
          if (!$loadView.Contains('DrawKabraSimpleLoading(sb, screen, ui);')) { throw 'Falta Cargando simplificado' }
          if (!$loadView.Contains('int fillWidth = (int)MathF.Round(channel.Width')) { throw 'Falta barra de progreso real' }
          if (!$loadView.Contains('ShowStats') -or !$loadView.Contains('SpeedText') -or !$loadView.Contains('EtaText')) { throw 'Faltan datos de descarga' }
          $load = Get-Content upstream/Client.Main/Scenes/LoadScene.cs -Raw
          if (!$load.Contains('_loadingView.ShowStats = progress.IsDownloading;')) { throw 'Progreso de descarga no conectado' }
          if (!$login.Contains('CODIGO {rawCode:D3}')) { throw 'No muestra codigo de login legible' }
          if ($login.Contains('Text = "MU KABRA ONLINE"')) { throw 'Quedo el titulo dorado en el login' }
          $net = Get-Content upstream/Client.Main/Networking/NetworkManager.cs -Raw
          if (!$net.Contains('SendKabraInitialPingAsync')) { throw 'Ping inicial no conectado a F1 00' }
          $main = Get-Content upstream/Client.Main/MuGame.cs -Raw
          if (!$main.Contains('AppSettings.ClientVersion = kabraClientVersion;') -or !$main.Contains('AppSettings.ClientSerial = kabraClientSerial;')) { throw 'Serial o version puede usar cache antigua' }
      - name: Preparar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verificar transporte Louis31 sin credenciales
        shell: pwsh
        run: dotnet run --project tests/Louis31Transport/KabraLouis31.TransportTests.csproj -c Release
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;27.2.12479018
          accept-android-sdk-licenses: true
      - name: Recuperar herramienta oficial apksigner de Android SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $src = Join-Path $env:ANDROID_HOME "build-tools/36.0.0/lib/apksigner.jar"
          if (!(Test-Path $src)) { throw "apksigner.jar no existe en Android SDK 36" }
          Copy-Item $src artifacts/apksigner.jar
      - name: Exportar herramienta oficial para validacion de firma
        uses: actions/upload-artifact@v4
        with:
          name: KABRA-ApkSigner-Oficial
          path: artifacts/apksigner.jar
          if-no-files-found: error

      - name: Instalar carga de trabajo Android
        shell: pwsh
        working-directory: upstream
        run: dotnet workload restore MuAndroid/MuAndroid.csproj --skip-manifest-update
      - name: Restaurar herramientas MonoGame
        shell: pwsh
        working-directory: upstream
        run: dotnet tool restore --tool-manifest MuAndroid/.config/dotnet-tools.json
      - name: Compilar APK Android nativo Debug
        shell: pwsh
        working-directory: upstream
        run: dotnet publish MuAndroid/MuAndroid.csproj -f net10.0-android -c Debug -r android-arm64 --disable-build-servers -m:1 -p:BuildInParallel=false -p:UseSharedCompilation=false -p:AndroidPackageFormats=apk -p:RestoreMonoGameTools=false -p:EmbedAssembliesIntoApk=true
      - name: Localizar y revisar APK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $apk = Get-ChildItem upstream/MuAndroid/bin/Debug -Recurse -Filter *.apk | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $apk) { throw "Compilacion sin APK instalable" }
          Write-Output "APK compilado: $($apk.FullName); Bytes=$($apk.Length)"
          Copy-Item $apk.FullName artifacts/KABRA-Android-v12.apk
      - name: Validar icono y firma Android con herramienta oficial
        shell: pwsh
        run: |
          $apk = "artifacts/KABRA-Android-v12.apk"
          if (!(Test-Path $apk)) { throw 'No existe el APK de salida' }
          $tool = Join-Path $env:ANDROID_HOME "build-tools/36.0.0/apksigner.bat"
          if (!(Test-Path $tool)) { throw "Falta apksigner oficial en $tool" }
          & $tool verify --verbose --print-certs --min-sdk-version 24 $apk
          if ($LASTEXITCODE -ne 0) { throw 'Fallo la verificacion oficial de firmas del APK' }
          Add-Type -AssemblyName System.IO.Compression
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $apk))
          try {
            $icon = $zip.GetEntry('res/mipmap-xxxhdpi-v4/ic_launcher.png')
            if (!$icon -or $icon.Length -lt 5000) { throw 'Logo launcher APK incorrecto o ausente' }
            $signedv1 = $zip.Entries | Where-Object { $_.FullName -eq 'META-INF/MANIFEST.MF' }
            if (!$signedv1) { throw 'La firma JAR v1 falta en APK de GitHub Actions' }
          } finally { $zip.Dispose() }

      - name: Publicar instalador de laboratorio
        uses: actions/upload-artifact@v4
        with:
          name: KABRA-Android-v12
          path: artifacts/KABRA-Android-v12.apk
          if-no-files-found: error
